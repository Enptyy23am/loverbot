<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С Днем Рождения! ❤️</title>
    <style>
        :root {
            --bg-color: #fdf8f5;
            --text-color: #2c2a29;
            --accent-color: #d96b66;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
            overflow-x: hidden;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        header {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            background: radial-gradient(circle at center, #fff0eb 0%, var(--bg-color) 70%);
        }

        .date-badge {
            background: var(--card-bg);
            color: var(--accent-color);
            padding: 8px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: 2px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--accent-color);
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.1rem;
            max-width: 520px;
            opacity: 0.85;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .letter {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            margin-bottom: 60px;
            font-size: 1.05rem;
        }

        .letter p {
            margin-bottom: 18px;
        }

        .letter p:last-child {
            margin-bottom: 0;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .polaroid {
            background: var(--card-bg);
            padding: 15px 15px 35px 15px;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
        }

        .polaroid:nth-child(odd) { transform: rotate(-2deg); }
        .polaroid:nth-child(even) { transform: rotate(2deg); }
        .polaroid:hover { transform: scale(1.03) rotate(0deg); }

        .polaroid img {
            width: 100%;
            height: 290px;
            object-fit: cover;
            border-radius: 4px;
            display: block;
            background-color: #f0ebe8;
        }

        .surprise-section {
            text-align: center;
            padding-bottom: 80px;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 16px 36px;
            font-size: 1.1rem;
            font-family: inherit;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(217, 107, 102, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(217, 107, 102, 0.4);
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .letter { padding: 25px; }
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <header>
        <div class="date-badge">28.11.2026</div>
        <h1>С Днем Рождения, любимый!</h1>
        <p class="subtitle">Маленькая страница о том, как сильно я тебя ценю и сколько крутых моментов у нас уже было.</p>
    </header>

    <div class="container">
        <!-- Блок с твоим текстом -->
        <section class="letter reveal" style="font-variant: small-caps; font-size: 1.15rem; text-align: center;">
            <p>Мы с тобой давно вместе, пускай у нас не так уж и много совместных фоток, но совместных воспоминаний у нас гораздо больше.</p>
        </section>

        <!-- Галерея без подписей -->
        <section class="gallery reveal">
            <div class="polaroid">
                <img src="photo1.jpg" alt="Фото 1">
            </div>

            <div class="polaroid">
                <img src="photo2.jpg" alt="Фото 2">
            </div>

            <div class="polaroid">
                <img src="photo3.jpg" alt="Фото 3">
            </div>

            <div class="polaroid">
                <img src="photo4.jpg" alt="Фото 4">
            </div>

            <div class="polaroid">
                <img src="photo5.jpg" alt="Фото 5">
            </div>

            <div class="polaroid">
                <img src="photo6.jpg" alt="Фото 6">
            </div>
        </section>

        <!-- Кнопка салюта -->
        <section class="surprise-section reveal">
            <button class="btn" onclick="launchConfetti()">Запустить праздничный салют 🎉</button>
        </section>
    </div>

    <script>
        function reveal() {
            const reveals = document.querySelectorAll(".reveal");
            for (let i = 0; i < reveals.length; i++) {
                const windowHeight = window.innerHeight;
                const elementTop = reveals[i].getBoundingClientRect().top;
                if (elementTop < windowHeight - 80) {
                    reveals[i].classList.add("active");
                }
            }
        }
        window.addEventListener("scroll", reveal);
        reveal();

        function launchConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const colors = ['#d96b66', '#f4a261', '#e9c46a', '#2a9d8f', '#e76f51', '#ff8fa3'];
            const pieces = [];

            for (let i = 0; i < 120; i++) {
                pieces.push({
                    x: canvas.width / 2,
                    y: canvas.height * 0.6,
                    w: Math.random() * 10 + 5,
                    h: Math.random() * 6 + 4,
                    vx: (Math.random() - 0.5) * 18,
                    vy: (Math.random() - 1) * 18 - 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    angle: Math.random() * 360,
                    spin: (Math.random() - 0.5) * 12
                });
            }

            let frame = 0;
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.45;
                    p.vx *= 0.98;
                    p.angle += p.spin;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.angle * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    ctx.restore();
                });

                frame++;
                if (frame < 140) {
                    requestAnimationFrame(animate);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            animate();
        }
    </script>
</body>
</html>
